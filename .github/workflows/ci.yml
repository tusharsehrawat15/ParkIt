name: ParkIt CI

on:
  push:
    branches: [main, feature/tests-and-ci]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run Integration & Concurrency Tests
        working-directory: backend
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/parkit_test
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci-test-secret-key
        run: npm test