services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongo:27017/parkit
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-local-jwt-secret
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data: