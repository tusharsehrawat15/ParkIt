<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkIt - Driver</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="min-h-screen bg-[#0b0f19] text-white">

  <!-- Main Centered App Container -->
  <div class="w-full max-w-md mx-auto min-h-screen flex flex-col pb-24">

    <!-- Top Header -->
    <header class="sticky top-0 z-20 bg-[#0b0f19]/90 backdrop-blur-md border-b border-gray-800/80 px-5 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <img src="assets/logo.svg" alt="ParkIt Logo" class="w-8 h-8 rounded-lg border border-emerald-500/40">
          <span class="text-xl font-bold tracking-tight">Park<span class="text-emerald-400">It</span></span>
          <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/40">
            DRIVER
          </span>
        </div>

        <!-- Refresh / Bell Button -->
        <button id="refreshFeedBtn" type="button" title="Refresh Live Slots"
          class="p-2 rounded-xl bg-gray-900/80 border border-gray-800 text-gray-300 hover:border-emerald-500/50 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Tab Views -->
    <main class="flex-1 px-5 pt-5">

      <!-- 1. Home Tab (Live Feed) -->
      <section id="sectionHome" class="space-y-4">
        <!-- Search Bar -->
        <div class="relative">
          <svg class="w-4 h-4 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" id="searchInput" placeholder="Search building, locality, or city..."
            class="w-full pl-11 pr-4 py-3 rounded-2xl bg-gray-900/90 border border-gray-800 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition-colors">
        </div>

        <!-- Filter Pills -->
        <div class="flex items-center gap-2.5">
          <button type="button" data-filter="ALL"
            class="filter-pill px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-500 text-gray-950 transition-all">
            All
          </button>
          <button type="button" data-filter="STANDARD"
            class="filter-pill px-4 py-2 rounded-xl text-xs font-semibold bg-gray-900/80 border border-gray-800 text-gray-300 hover:border-gray-600 transition-all">
            🚗 Parking
          </button>
          <button type="button" data-filter="EV"
            class="filter-pill px-4 py-2 rounded-xl text-xs font-semibold bg-gray-900/80 border border-gray-800 text-gray-300 hover:border-gray-600 transition-all">
            ⚡ EV
          </button>
        </div>

        <!-- Section Header -->
        <div class="flex items-center justify-between pt-1">
          <h2 class="text-sm font-bold text-white">Available Locations</h2>
          <span id="buildingsCount" class="text-xs font-semibold text-emerald-400">0 found</span>
        </div>

        <!-- Building Cards List -->
        <div id="buildingsList" class="space-y-3">
          <div class="glass-card rounded-2xl p-6 text-center text-xs text-gray-400">
            Loading live parking &amp; EV locations...
          </div>
        </div>
      </section>

      <!-- 2. Activity Tab (Placeholder for Step 3) -->
      <section id="sectionActivity" class="hidden space-y-5">
        <div>
          <h1 class="text-xl font-bold">Activity &amp; Receipts</h1>
          <p class="text-xs text-gray-400 mt-0.5">Live session &amp; past bookings</p>
        </div>
        <div class="glass-card rounded-2xl p-6 text-center text-sm text-gray-400">
          Live Receipt &amp; History coming next...
        </div>
      </section>

      <!-- 3. Account Tab (Placeholder for Step 3) -->
      <section id="sectionAccount" class="hidden space-y-5">
        <div>
          <h1 class="text-xl font-bold">Driver Account</h1>
          <p class="text-xs text-gray-400 mt-0.5">Profile &amp; registered vehicle</p>
        </div>
        <div class="glass-card rounded-2xl p-6 text-center text-sm text-gray-400">
          Profile &amp; Logout coming next...
        </div>
      </section>

    </main>

    <!-- Fixed Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#0b0f19]/95 backdrop-blur-md border-t border-gray-800/80 px-6 py-3 z-30">
      <div class="grid grid-cols-3 gap-2">

        <button type="button" id="navHome" class="flex flex-col items-center gap-1 text-emerald-400 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z" />
          </svg>
          <span class="text-[11px] font-semibold">Home</span>
        </button>

        <button type="button" id="navActivity" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="text-[11px] font-semibold">Activity</span>
        </button>

        <button type="button" id="navAccount" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
          <span class="text-[11px] font-semibold">Account</span>
        </button>

      </div>
    </nav>

  </div>

  <script src="js/driver.js"></script>
</body>

</html>
